function demoApi(route,d){
 let entry=JSON.parse(localStorage.getItem("parklineDemoActive")||"null");
 if(route==="status")return {online:true,slots:[1,2,3,4].map(id=>({id,occupied:id===3,available:id!==3&&!(entry?.slot===id&&entry.state==="RESERVED")}))};
 if(route==="book"){if(d.slot===3||entry?.state==="RESERVED")throw Error("ช่องจอดยังไม่พร้อม");const token="DEMO-A0"+d.slot;entry={slot:d.slot,token,state:"RESERVED",events:[[new Date().toISOString(),"ยืนยันการจองทดลองแล้ว"]]};localStorage.setItem("parklineDemoActive",JSON.stringify(entry));return {slot:d.slot,token,qr:sampleQR[d.slot-1]};}
 if(!entry||entry.token!==d.token)throw Error("ไม่พบตั๋วทดลอง");
 if(route==="cancel"){entry.state="CANCELLED";entry.events.push([new Date().toISOString(),"ยกเลิกการจองแล้ว"]);localStorage.setItem("parklineDemoActive",JSON.stringify(entry));}
 return entry;
}
const el=id=>document.getElementById(id), demo=true, key=demo?"parklineDemoTicket":"parkingTicket";
let ticket=null, selected=null, busy=false, polling=false, current=null;
try{ticket=JSON.parse(localStorage.getItem(key)||"null")}catch{}
const labels={RESERVED:"จองแล้ว",ENTERING:"กำลังเข้า",INSIDE:"เข้าลานแล้ว",LEAVING:"กำลังออก",LEFT:"รอช่องว่าง",DONE:"จบการจอง",CANCELLED:"ยกเลิกแล้ว"};
const nameOf=i=>"A"+String(i).padStart(2,"0");
async function api(route,data={}) {
 if(demo)return demoApi(route,data);
 const r=await fetch("/api/"+route,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
 const v=await r.json();if(!r.ok)throw Error(v.error||"เชื่อมต่อไม่ได้");return v;
}
function renderTicket(){
 el("empty").hidden=!!ticket;el("ticket").hidden=!ticket;el("state").hidden=!ticket;
 if(ticket){el("title").textContent="ช่องจอด "+nameOf(ticket.slot);el("qr").src=el("download").href=ticket.qr;}
}
const buttons=[1,2,3,4].map(i=>{
 const b=document.createElement("button");b.className="space";b.innerHTML='<span class="mark" aria-hidden="true"></span><strong></strong><small><i class="statusdot"></i><span></span></small>';b.querySelector("strong").textContent=nameOf(i);
 b.onclick=()=>{selected=i;draw();el("msg").textContent="";};el("spaces").append(b);return b;
});
function draw(){
 const slots=current?.slots||[];
 if(!slots.some(x=>x.id===selected&&x.available))selected=null;
 buttons.forEach((b,i)=>{const s=slots[i];b.disabled=!current?.online||busy||!!ticket||!s?.available;
 b.setAttribute("aria-pressed",String(!ticket&&selected===i+1));b.querySelector("small span").textContent=!current?.online?"รอสัญญาณ":s.occupied?"มีรถจอด":s.available?"ว่าง":ticket?.slot===i+1?"บัตรของคุณ":"มีผู้จอง";});
 el("count").textContent=current?.online?slots.filter(x=>x.available).length:"–";
 el("online").textContent=demo?"โหมดทดลอง":current?.online?"บอร์ดออนไลน์":"บอร์ดออฟไลน์";
 el("reserve").disabled=!selected||!!ticket||busy||!current?.online;
 el("reserve").textContent=busy?"กำลังยืนยัน…":ticket?"มีบัตรจอดรถแล้ว":selected?"ยืนยันจองช่อง "+nameOf(selected):"เลือกช่องที่ต้องการจอง";
}
async function refresh(){
 if(polling)return;polling=true;
 try{current=await api("status");draw();
 if(ticket){const prior=ticket;const d=await api("mine",{token:ticket.token});if(ticket!==prior)return;
 el("state").textContent=labels[d.state]||d.state;
 const lines=d.events.map(([date,msg])=>new Date(date).toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"})+" · "+msg);
 if(el("history").dataset.events!==JSON.stringify(lines)){el("history").replaceChildren(...lines.map(t=>{let li=document.createElement("li");li.textContent=t;return li;}));el("history").dataset.events=JSON.stringify(lines);}
 el("cancel").hidden=d.state!=="RESERVED";el("finish").hidden=!["DONE","CANCELLED"].includes(d.state);
 }}catch(e){current=null;draw();el("msg").textContent=e.message;}finally{polling=false;}
}
el("reserve").onclick=async()=>{if(busy||ticket||!selected)return;const slot=selected;busy=true;draw();
 try{ticket=await api("book",{slot});localStorage.setItem(key,JSON.stringify(ticket));selected=null;renderTicket();el("msg").textContent=demo?"ออกบัตรทดลองแล้ว":"จองสำเร็จ บันทึก QR ไว้ใช้ที่ประตู";el("ticket").scrollIntoView({block:"nearest"});}
 catch(e){el("msg").textContent=e.message;}finally{busy=false;draw();refresh();}};
el("cancel").onclick=async()=>{if(ticket&&confirm("ยกเลิกการจองช่อง "+nameOf(ticket.slot)+"?"))try{await api("cancel",{token:ticket.token});refresh();}catch(e){el("msg").textContent=e.message;}};
el("finish").onclick=()=>{ticket=null;localStorage.removeItem(key);el("msg").textContent="";renderTicket();draw();refresh();};
el("copy").onclick=async()=>{try{await navigator.clipboard.writeText(ticket.token);el("msg").textContent="คัดลอกรหัสตั๋วแล้ว";}catch{prompt("คัดลอกรหัสตั๋ว",ticket.token);}};
el("push").hidden=true;renderTicket();draw();refresh();setInterval(refresh,1500);</script></body></html>
